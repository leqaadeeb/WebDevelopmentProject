<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #74bbc2;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 100);
        width: 300px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .group {
        margin-bottom: 15px;
    }

    .group select {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }
    
    label {
        display: block;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #2161a4;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #7196bf;
    }

</style>

<body>
    <div class="container">
        <h2>Student Registration Form</h2>
        <form id="registrationForm">

            <div class="group">
                <label for="fullName">Enter your Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter your full name" name="fullName" required>
            </div>
    
            <div class = "group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Write a valid email" required>
            </div>

            <div class="group">
                <label for="Year">Select what Year you are in:</label>
                <select id="Year" name="Year" required>
                    <option value="">Select your year</option>
                    <option value="firstYear">Freshmen</option>
                    <option value="secondYear">Sophomore</option>
                    <option value="thirdYear">Junior</option>
                    <option value="fourthYear">Senior</option>
                </select>
                
            </div>

            <div class="group">
                <label for ="course">Select a Course:</label>
                <select id="course" name="course" required>
                    <option value="">--Select a course--</option>
                    <option value="computerScience">Computer Science</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>  
                </select>  
            </div>
           
            <button type="button" onclick="submitForm()">Submit</button>
        </form>
    </div>
</body>

<script>
    function submitForm() {
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const year = document.getElementById('Year').value;
        const course = document.getElementById('course').value;
        if (fullName && email && year && course) {
            alert(`Form submitted successfully!\nFull Name: ${fullName}\nEmail: ${email}\nYear: ${year}\nCourse: ${course}`);
            document.getElementById('registrationForm').reset();
        } else {
            alert('Please fill in all required fields.');
        }
    }
</script>

</html>
