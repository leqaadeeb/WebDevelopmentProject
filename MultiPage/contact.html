<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <meta name = "description" content = "Contact Leqaa - Developer Portfolio">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container single-column-container">

        <nav class="navbar" id="nav"></nav>

        <div class="contact-header">
            <h1>Get In Touch</h1>
            <p>Have a question, feedback, or an internship opportunity? Send a message below!</p>
        </div>

        <div class="contact-wrapper">
        
        <div class="contact-info card-box">
            <h3>Contact Information</h3>
            <p>I'm always open to discussing new projects, research opportunities, or internship roles.</p>
            
            <div class="info-item">
                <strong>📍 Location:</strong>
                <p>San José, CA</p>
            </div>
            
            <div class="info-item">
                <strong>📧 Email:</strong>
                <p>leqaadeeb8@gmail.com</p>
            </div>

            <div class="info-item">
                <strong>💼 Socials:</strong>
                <p><a href="https://www.linkedin.com/in/leqaa-deeb/" target="_blank">LinkedIn</a> | <a href="https://github.com/leqaadeeb" target="">GitHub</a></p>
            </div>
        </div>

        <form id="contact-form">
            <div class="form-group">
                <label for ="name">Name</label>
                <input id="name" placeholder="Enter your full name." type="text">
            </div>

            <div class="form-group">
                <label for = "email">Email</label>
                <input id="email" placeholder="Please Enter your email"  type="email">
            </div>

            <div class="form-group">
                <label for = "message">Message</label>
                <textarea name="message" id="message" cols="20" rows="5" placeholder="Please type your message here"></textarea>
            </div>

            <button type="submit" id="submit-btn"> Send Message </button>
        </form>

        <div id="form-feedback"></div>
        <script src="script.js"></script>
    </div>
        
    </div>
</body>
</html>
