<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful flower field">
    <title>Leqaa's Flower Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: rgb(221, 149, 181);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90vw;
            /* Makes it take up 90% of the screen width */
            max-width: 1200px;
            /* Stops it from becoming overwhelmingly wide on huge monitors */
            height: 80vh;
            /* Takes up 80% of the screen height */
            min-height: 550px;
            /* Ensures it doesn't get squished vertically on small screens */
            background-color: #ffffff;
            display: flex;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .left {
            width: 35%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .navbar {
            display: flex;
            gap: 20px;
        }

        .navbar a {
            text-decoration: none;
            color: #666;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .navbar a:hover {
            color: #000;
        }

        .hero-text .tagline {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
        }

        .hero-text h1 {
            font-size: 2rem;
            line-height: 1.2;
            color: #111;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .hero-text .shop-btn {
            display: inline-block;
            color: #000;
            font-weight: bold;
            text-decoration: underline;
            font-size: 0.9rem;
        }

        .contact-info {
            margin-top: auto; /* Pushes footer to the bottom of the available vertical space */
            font-size: 0.8rem;
            color: #777;
            padding-top: 50px; /* Adds a little space above it */
        }

        .pagination button {
            border: 1px solid #ccc;
            background: transparent;
            padding: 8px 12px;
            cursor: pointer;
            margin-right: 4x;
        }

        .pagination button.active {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }

        .right {
            width: 60%;
            padding: 30px;
            height: 100%;
            /* Keeps the grid inside the container height */

            display: grid;
            grid-template-columns: 1fr 1fr;

            /* Top row takes 1 fraction, Bottom row takes 1.3 fractions */
            grid-template-rows: 1fr 1.3fr;
            gap: 15px;
        }

        .right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            min-height: 0;
        }

        .img3 {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">

            <nav class="navbar">
                <a href="#">About</a>
                <a href="#">Shop</a>
                <a href="#">Instagram</a>
            </nav>

            <div class="hero-text">
                <span class="tagline"> Leqaa's Flower Shop </span>
                <h1> Fresh Flowers Dilevered to Your Door</h1>
                <p> This is where you can find beauty and elegance in every bloom, color, and shape.</p>
                <a href="#" class="shop-btn"> Shop Now &rarr;</a>
                <footer class="contact-info">Contact US at info@leqaasflowershop.com</footer>
            </div>

            <div class="pagination">
                <button class="active">1</button>
                <button>2</button>
            </div>
        </div>

        <div class="right">
            <img src="Images1/FlowerBouqet.jpg" alt="One of our flower bouqets" class="img1">
            <img src="Images1/FlowerDecoration.jpg" alt="We offer flower decorations" class="img2">
            <img src="Images1/FlowerShop.jpg" alt="This is our Flower Shop" class="img3">
        </div>
    </div>

</body>

</html>
